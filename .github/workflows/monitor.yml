name: Bidoo Monitor

on:
  schedule:
    # Ogni 5 minuti (minimo consentito da GitHub Actions)
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: bidoo-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ripristina stato alert (cooldown)
        uses: actions/cache@v4
        with:
          path: .alert_state.json
          key: bidoo-alert-state-v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze e browser
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Esegui controllo Bidoo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BIDOO_USE_PLAYWRIGHT: "true"
          MIN_RETAIL_VALUE: "10"
          MAX_PRICE_RATIO: "0.35"
        run: python monitor.py --once
