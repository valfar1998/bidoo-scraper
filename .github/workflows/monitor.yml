name: Resale Monitor (cloud)

# Multi-sito: Remundo, PrezziShock, Antiebay, Wallapop, Vinted, Subito, eBay, Catawiki, Gobid, Astagiudiziaria.
# Bidoo OFF di default (Cloudflare blocca spesso gli IP GitHub).
# Catawiki/Gobid/IVG possono tornare 0 lotti da datacenter (Akamai/WAF) → meglio self-hosted o PC di casa.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: resale-monitor-cloud
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ripristina stato monitor
        uses: actions/cache@v4
        with:
          path: |
            .alert_state.json
            .auction_history.json
            .feedback.json
            .site_cooldown.json
            data/comps.csv
          key: resale-monitor-state-v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze e browser
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Esegui monitor multi-sito
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INCLUDE_BIDOO: "false"
          ENABLED_SOURCES: "remundo,prezzishock,antiebay,industrial_discount,catawiki,gobid,astagiudiziaria"
          USE_PLAYWRIGHT: "true"
          USE_PLAYWRIGHT_ON_GITHUB: "false"
          BIDOO_USE_PLAYWRIGHT: "true"
          BIDOO_SOFT_FAIL: "true"
          MIN_RESALE_PROFIT_EUR: "25"
          MIN_RESALE_MARGIN_PCT: "25"
          MIN_RESALE_SCORE: "50"
          MIN_PRICE_HEADROOM_EUR: "1"
          ALERT_KINDS: "deal"
          MAX_HOURS_TO_END: "4"
          MAX_HOURS_TO_END_JUDICIAL: "24"
          MAX_BUY_OF_OFFICIAL_PCT: "40"
          MAX_PALLET_EUR: "400"
          MAX_COST_PER_PIECE_EUR: "15"
          GOBID_DEPOSIT_EUR: "50"
          JUDICIAL_DEPOSIT_EUR: "30"
          PICKUP_COST_EUR: "35"
          CLASSIC_SKIP_HYPER: "true"
          SKIP_HEAVY_ITEMS: "true"
          CATAWIKI_QUERIES: "orologio casio,borsa,sneaker,profumo,lampada"
        run: python monitor_all.py
        continue-on-error: true
