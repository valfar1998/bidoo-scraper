name: Bidoo Monitor (cloud)

# ATTENZIONE: Bidoo/Cloudflare blocca spesso gli IP di GitHub (pagina "Ci siamo quasi…").
# Questo workflow non fallisce (soft fail) ma probabilmente NON invierà alert.
# Soluzione affidabile: setup-windows-task.ps1 sul tuo PC oppure monitor-self-hosted.yml

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: bidoo-monitor-cloud
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ripristina stato alert (cooldown)
        uses: actions/cache@v4
        with:
          path: .alert_state.json
          key: bidoo-alert-state-v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze e browser
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Esegui controllo Bidoo (modalità radar)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BIDOO_USE_PLAYWRIGHT: "true"
          BIDOO_SOFT_FAIL: "true"
          MONITOR_MODE: radar
          MIN_RETAIL_VALUE: "50"
          MIN_SAVINGS_EUR: "30"
          HIGH_VALUE_THRESHOLD: "100"
          MAX_PRICE_RATIO_HIGH: "0.15"
          MAX_PRICE_RATIO_MID: "0.25"
          BIDOO_URL: "https://it.bidoo.com/"
        run: python monitor.py --once --mode radar
