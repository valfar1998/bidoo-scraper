name: Resale Monitor (self-hosted)

# Runner self-hosted sul PC Windows (IP di casa): migliore contro Cloudflare/Akamai/WAF.
# Setup: Repo → Settings → Actions → Runners → New self-hosted runner
# Disabilita il workflow cloud se usi solo questo.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: resale-monitor-self-hosted
  cancel-in-progress: false

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ripristina storico / feedback / comps
        uses: actions/cache@v4
        with:
          path: |
            .alert_state.json
            .auction_history.json
            .feedback.json
            .site_cooldown.json
            data/comps.csv
          key: resale-monitor-state-${{ runner.os }}-v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze e Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Esegui monitor multi-sito
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INCLUDE_BIDOO: "false"
          ENABLED_SOURCES: "remundo,prezzishock,industrial_discount,catawiki,gobid,astagiudiziaria"
          USE_PLAYWRIGHT: "true"
          MIN_RESALE_PROFIT_EUR: "20"
          MIN_RESALE_MARGIN_PCT: "25"
          MIN_RESALE_SCORE: "50"
          MIN_PRICE_HEADROOM_EUR: "1"
          ALERT_KINDS: "deal"
          MAX_HOURS_TO_END: "4"
          MAX_HOURS_TO_END_JUDICIAL: "24"
          MAX_BUY_OF_OFFICIAL_PCT: "40"
          MAX_PALLET_EUR: "400"
          MAX_COST_PER_PIECE_EUR: "15"
          GOBID_DEPOSIT_EUR: "50"
          JUDICIAL_DEPOSIT_EUR: "30"
          PICKUP_COST_EUR: "35"
          CLASSIC_SKIP_HYPER: "true"
          SKIP_HEAVY_ITEMS: "true"
          CATAWIKI_QUERIES: "orologio casio,borsa,sneaker,profumo,lampada"
        run: python monitor_all.py
