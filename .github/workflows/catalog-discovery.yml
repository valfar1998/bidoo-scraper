name: Catalog Discovery

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: data/monitor.db
          key: resale-monitor-db-v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Discovery catalogo
        env:
          USE_DATABASE: "true"
          MONITOR_MODE: "discovery"
          ENABLED_SOURCES: "prezzishock,astegiudiziarie,catawiki,gobid,astagiudiziaria,industrial_discount,remundo"
          ROTATING_PROXY_URL: ${{ secrets.ROTATING_PROXY_URL }}
          FLARESOLVERR_URL: ${{ secrets.FLARESOLVERR_URL }}
        run: python monitor_all.py
