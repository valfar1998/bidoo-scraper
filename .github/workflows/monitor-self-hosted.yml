name: Bidoo Monitor (self-hosted)

# Usa un runner self-hosted sul tuo PC Windows (rete di casa).
# Setup: GitHub repo → Settings → Actions → Runners → New self-hosted runner
# Poi abilita questo workflow e disabilita monitor.yml se vuoi.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: bidoo-monitor-self-hosted
  cancel-in-progress: false

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ripristina storico aste e cooldown alert
        uses: actions/cache@v4
        with:
          path: |
            .alert_state.json
            .auction_history.json
          key: bidoo-resale-state-${{ runner.os }}-v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui controllo fonti iscritte
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_RESALE_PROFIT_EUR: "20"
          MIN_RESALE_MARGIN_PCT: "25"
          MIN_RESALE_SCORE: "50"
          ALERT_KINDS: "deal"
          ENABLED_SOURCES: "remundo,prezzishock,industrial_discount,catawiki,gobid,astagiudiziaria"
          INCLUDE_BIDOO: "false"
          USE_PLAYWRIGHT: "true"
        run: python monitor_all.py
