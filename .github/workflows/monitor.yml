name: Bidoo Monitor (cloud)

# ATTENZIONE: Bidoo/Cloudflare blocca spesso gli IP di GitHub (pagina "Ci siamo quasi…").
# Questo workflow non fallisce (soft fail) ma probabilmente NON invierà alert.
# Soluzione affidabile: setup-windows-task.ps1 sul tuo PC oppure monitor-self-hosted.yml

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: bidoo-monitor-cloud
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ripristina stato monitor
        uses: actions/cache@v4
        with:
          path: |
            .alert_state.json
            .auction_history.json
          key: bidoo-resale-state-v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze e browser
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Esegui controllo rivendita Bidoo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BIDOO_USE_PLAYWRIGHT: "true"
          BIDOO_SOFT_FAIL: "true"
          MIN_RESALE_PROFIT_EUR: "25"
          MIN_RESALE_MARGIN_PCT: "35"
          MIN_RESALE_SCORE: "65"
          ALERT_KINDS: "deal"
        run: python monitor.py --once
