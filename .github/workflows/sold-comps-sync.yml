name: Sold Comps Sync (weekly)

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ripristina comps e database
        uses: actions/cache@v4
        with:
          path: |
            data/comps.csv
            data/monitor.db
          key: resale-monitor-comps-v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze e browser
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Sync comps venduti
        env:
          USE_DATABASE: "true"
          BACKUP_TARGETS: "telegram"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BACKUP_CHAT_ID: ${{ secrets.TELEGRAM_BACKUP_CHAT_ID }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          ROTATING_PROXY_URL: ${{ secrets.ROTATING_PROXY_URL }}
          FLARESOLVERR_URL: ${{ secrets.FLARESOLVERR_URL }}
        run: python sold_comps_sync.py
